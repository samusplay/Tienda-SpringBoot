spring.datasource.url=jdbc:mysql://127.0.0.1:3307/tienda?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=admin
spring.datasource.password=password1



spring.docker.compose.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# SMTP para pruebas (Mailtrap de ejemplo)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=TU_USUARIO_MAILTRAP
spring.mail.password=TU_PASSWORD_MAILTRAP

spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Remitente por defecto (solo para info, lo usaremos en el service)
app.mail.from=tienda@example.com

# incluir el mensaje de la excepción en la respuesta de error
server.error.include-message=always
# opcional: incluir errores de validación de @Valid
server.error.include-binding-errors=always
